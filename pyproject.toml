[project]
name = "csinet"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "scikit-learn>=1.5",
  "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0"]
deepmimo = [
    "deepmimo==4.0.0b7",
    "pandas>=2.3.3",
]

[tool.hatch.build.targets.wheel]
packages = ["csinet"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
